spring.application.name=bar_do_bruce

# ===================================================================
# DATABASE CONNECTION CONFIGURATION
# ===================================================================
# Connection URL pointing to your MySQL server and database name
spring.datasource.url=jdbc:mysql://localhost:3306/your_database_name?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database authentication credentials
spring.datasource.username=your_username
spring.datasource.password=your_password

# Standard driver class name for modern MySQL Connectors (MySQL 8+)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# Modern dialect optimization for MySQL 8 and newer
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# DDl-auto strategies: update (safely updates schema), create, create-drop, or none
spring.jpa.hibernate.ddl-auto=update

# Enable to output formatted SQL queries to the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true